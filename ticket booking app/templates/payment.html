<!DOCTYPE html>
<html>
<head>
    <title>Payment</title>

    <style>
    body {
        font-family: Arial;
        background: #eef2f7;
        text-align: center;
    }

    .box {
        background: white;
        padding: 20px;
        margin: 80px auto;
        width: 300px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    button {
        padding: 10px 20px;
        background: green;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background: darkgreen;
    }
    </style>
</head>

<body>

<div class="box">
    <h2>💳 Payment</h2>
    <p><b>Event:</b> {{ event.title }}</p>
    <p><b>Amount:</b> ₹{{ "%.2f"|format(event.price) }}</p>

    <form method="POST">
        <button type="submit">Pay Now</button>
    </form>
</div>

</body>
</html>
